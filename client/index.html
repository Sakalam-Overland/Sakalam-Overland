<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sakalam Overland: Filipino-founded overland crew, New York</title>
    <meta name="description" content="Sakalam Overland is a Filipino-founded community of overlanders and hikers in New York. Group rides, campouts, trail guides and salu-salo." />
    <meta name="theme-color" content="#12301c" />
    <script>
      // Pick the theme before first paint so there's no flash: saved choice, else the system setting.
      try {
        var t = localStorage.getItem('sakalam:theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <meta property="og:title" content="Sakalam Overland" />
    <meta property="og:description" content="Sama-sama sa daan: together on the trail." />
    <meta property="og:image" content="/brand/logo-color.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Outfit:wght@200;300;400&family=Noto+Sans+Tagalog&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
